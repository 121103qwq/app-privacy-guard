plugins { id 'com.android.application' }
android {
    namespace 'org.appprivacy.browser'
    compileSdk 34
    defaultConfig { applicationId 'org.appprivacy.browser'; minSdk 29; targetSdk 34; versionCode 20; versionName '0.2.0' }
    buildTypes { release { minifyEnabled false; debuggable false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
